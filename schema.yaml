examples:
- domain: Olist
  question: How many total customers are there?
  sql: SELECT COUNT(customer_id) FROM dim_customers;
- domain: Olist
  question: Which seller state has the most sellers?
  sql: SELECT seller_state, COUNT(seller_id) as total FROM dim_sellers GROUP BY seller_state
    ORDER BY total DESC LIMIT 1;
- domain: Olist
  question: What is the average review score?
  sql: SELECT AVG(review_score) FROM fact_reviews;
- domain: Olist
  question: Show the top 5 product categories by number of products.
  sql: SELECT product_category_name, COUNT(product_id) as cnt FROM dim_products GROUP
    BY product_category_name ORDER BY cnt DESC LIMIT 5;
- domain: Olist
  question: What is the total freight value paid?
  sql: SELECT SUM(freight_value) FROM fact_order_items;
- domain: India EV
  question: Which state has the most 2W EV registrations?
  sql: SELECT state_name FROM ev_state_registrations WHERE vehicle_category = '2W'
    ORDER BY total_units DESC LIMIT 1;
- domain: India EV
  question: Total fast chargers in Maharashtra?
  sql: SELECT fast_chargers FROM ev_charging_stations WHERE state_name = 'Maharashtra';
- domain: India EV
  question: How many 4W EVs were registered in Delhi in 2024?
  sql: SELECT total_units FROM ev_state_registrations WHERE state_name = 'Delhi' AND
    vehicle_category = '4W' AND registration_year = 2024;
- domain: India EV
  question: List all states with more than 1500 fast chargers.
  sql: SELECT state_name FROM ev_charging_stations WHERE fast_chargers > 1500;
- domain: India EV
  question: What is the total number of public chargers across all states?
  sql: SELECT SUM(public_chargers) FROM ev_charging_stations;
- domain: Synthetic PII
  question: How many synthetic customers are in each city?
  sql: SELECT city, COUNT(*) FROM synthetic_customers_safe GROUP BY city ORDER BY
    COUNT(*) DESC;
